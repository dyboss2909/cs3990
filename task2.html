          ingredients: [
            '1 cup flour',
            '1 egg',
            '1 cup milk',
            '2 tbsp sugar',
            '1 tsp baking powder',
            'Maple syrup (to serve)'
          ],
          steps: [
            'Mix dry ingredients in a bowl.',
            'Add milk & egg, whisk until smooth.',
            'Pour batter onto a hot non-stick pan.',
            'Flip when bubbles appear. Stack & drizzle syrup.'
          ],
          bgColor: 'teal',
          ingredientColor: 'gold',
          instructionColor: 'violet'
        }
      ];

      const mealElements = mealCards.map((meal, index) => {
        const title = React.createElement('h1', { className: 'meal-title' }, meal.title);

        const image = React.createElement('img', {
          className: 'meal-img',
          src: meal.image,
          alt: meal.title
        });

        const ingredientList = React.createElement(
          'ul',
          { className: 'ingredient-list' },
          meal.ingredients.map((item, i) =>
            React.createElement(
              'li',
              {
                key: i,
                className: 'ingredient-item',
                style: { backgroundColor: meal.ingredientColor }
              },
              item
            )
          )
        );

        const stepList = React.createElement(
          'ol',
          { className: 'step-list' },
          meal.steps.map((step, i) =>
            React.createElement(
              'li',
              {
                key: i,
                className: 'step-item',
                style: { backgroundColor: meal.instructionColor }
              },
              step
            )
          )
        );

        const card = React.createElement(
          'div',
          {
            key: index,
            className: 'meal-card',
            style: { backgroundColor: meal.bgColor }
          },
          title,
          image,
          React.createElement('h3', null, 'Ingredients'),
          ingredientList,
          React.createElement('h3', null, 'Instructions'),
          stepList
        );

        return card;
      });

      const app = React.createElement('div', null, mealElements);

      ReactDOM.render(app, document.getElementById('react-container'));
    </script>
